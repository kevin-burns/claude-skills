# prek / pre-commit hooks for claude-skills.
#
#   prek install          install the git hook (an uninstalled hook is not a gate)
#   prek run --all-files  first run, or after editing this file
#
# prek is the Rust reimplementation and reads this exact format, so the config stays
# portable to pre-commit proper.
#
# WHAT THIS REPO IS, because it changes which hooks make sense: a skills monorepo that
# is mostly markdown, with 52 tracked first-party Python files and a lot of DELIBERATELY
# BROKEN TEST MATERIAL. Several eval fixtures carry planted bugs, malformed JSON, or
# missing newlines on purpose. Every hook below was checked against them before it was
# enabled — see the notes on end-of-file-fixer and ruff.
#
# Pins verified against the upstream repos on 2026-08-15, not assumed. They match the
# versions the CI lint job uses; when one moves, both move.

# pre-commit 3.x renamed the stage `commit` -> `pre-commit`. prek accepts either;
# `pre-commit` is what stays valid under pre-commit proper.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # v0.16.x renamed the ids: `ruff` is now a legacy alias for `ruff-check`.
      # Configuration comes from ruff.toml at the repo root — nothing is passed here
      # that could disagree with what CI runs.
      #
      # NOTE: 140 findings exist today (claude-skills-a1b.1). This hook only sees
      # STAGED files, so it does not block unrelated work, but a commit touching an
      # unfixed script will fail until that bead is done. That is the intended
      # pressure, not an accident.
      - id: ruff-check
        args: [--fix]

      # ruff-format is DELIBERATELY ABSENT. Running it would rewrite every tracked
      # Python file in one commit, burying the lint fixes it is meant to sit beside.
      # ruff.toml says the same. It gets its own change, or it does not happen.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # MEASURED 2026-08-15: all 5 tracked YAML files parse, including the openapi
      # reference and the fact-verifier fixture. Adopts clean.
      - id: check-yaml

      # MEASURED: every tracked .json parses strictly. No exclusion needed — unlike
      # the upstream config, this repo has no .jsonc and no tsconfig.json, so the
      # JSONC carve-out there does not apply here.
      #
      # DO NOT OVERSELL THIS HOOK. The plugin manifests are this repo's most silent
      # failure surface: a manifest with the wrong SHAPE parses perfectly and then
      # registers zero skills. check-json catches malformed JSON and nothing else.
      # See the agent-plugin-manifests memory and claude-skills-dyy.
      - id: check-json
      - id: check-toml

      # MEASURED: 3 text files lack a final newline, all of them
      # azadvertizer/evals/fixtures/*.meta.json.
      #
      # CHECKED BEFORE ENABLING, because this repo hashes some fixtures: the .meta.json
      # files are NOT hashed — their own sha256 field is the literal string "fixture" —
      # and azadvertizer hashes the .csv payloads, which all already end in a newline.
      # The job-feeds fixtures are read with read_bytes() and immediately parsed as
      # JSON or XML, where a trailing newline is inert.
      #
      # Binaries are safe by construction: this hook declares `types: [text]`, so the
      # 20-plus tracked .woff2 fonts, PNGs and .webp images are never opened. Verified
      # against the v6.0.0 manifest rather than assumed — appending a newline to a font
      # would corrupt it silently.
      - id: end-of-file-fixer

      # MEASURED: 25 tracked files carry trailing whitespace. Same `types: [text]`
      # protection. Expect one sizeable cleanup commit on the first --all-files run.
      - id: trailing-whitespace

      - id: check-merge-conflict

      # MEASURED: largest tracked file is 292 KB
      # (excalidraw-diagram/references/examples/cicd-pipeline.png), so 500 has real
      # headroom. The 8 MB vendored excalidraw.mjs is gitignored and never staged.
      - id: check-added-large-files
        args: [--maxkb=500]

      - id: detect-private-key

      # MEASURED: 24 tracked files have a shebang and mode 100644 — 23 Python (ruff's
      # EXE001 sees those) plus one other file that only this hook covers.
      #
      # THE TRAP: this reads the GIT INDEX, not the filesystem. `chmod +x` alone does
      # not satisfy it; the mode is tracked, so it needs `git update-index --chmod=+x`
      # or a re-add. Budget for that in claude-skills-a1b.1.
      - id: check-shebang-scripts-are-executable

      # macOS is case-insensitive and Linux CI is not. A pair of files differing only
      # in case commits cleanly here and breaks the build there.
      - id: check-case-conflict

  # Broad-spectrum secret scanner, and the highest-value hook here. This repo is PUBLIC,
  # documents credential env vars across 22 skills (GEMINI_API_KEY, BRAVE_SEARCH_API_KEY,
  # GHOST_STAFF_ACCESS_TOKEN, MIRROR_TOKEN, LINEAR_API_TOKEN, staff tokens in
  # {id}:{secret} form), and feeds a generated public mirror — so a real key committed as
  # an "example" propagates to a SECOND public repo on the next sync.
  #
  # It catches what detect-private-key cannot: connection strings carrying passwords,
  # cloud API keys (AWS, GitHub, Anthropic, OpenAI, Stripe, Supabase, Neon) and ~160
  # other token patterns.
  #
  # KNOW ITS LIMIT. gitleaks guards the repo boundary and nothing else. It did NOT catch
  # either of the two real credential exposures in this project's history, because
  # neither was a commit — one PAT was pasted into a chat window and another was echoed
  # by expanding ${VAR:-default} to test whether it was set. See the
  # secret-handling-shell memory. A clean gitleaks run is not evidence that no secret
  # escaped.
  #
  # This hook scans STAGED CHANGES only. Whether something already landed is a different
  # question, answered by the full-history job in .github/workflows/ci.yml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Workflow linting. Upstream has no equivalent because it has no workflows; this repo
  # has two, and they are shell-heavy — which is where actionlint earns its place, since
  # it runs shellcheck over every `run:` block as well as validating expressions.
  #
  # WHAT IT ACTUALLY CATCHES, verified by injecting three deliberate defects rather than
  # trusting the description:
  #   caught  SC2086, an unquoted variable in a run: block (via shellcheck)
  #   caught  ${{ github.nosuchfield }}, a property that does not exist on the context
  #   MISSED  uses: actions/chekout@v5 — a typo'd action ref. Confirming an action exists
  #           needs a network call, and actionlint does not make one.
  #
  # SET EXPECTATIONS ACCORDINGLY. It would not have caught either mirror bug shipped on
  # 2026-08-14: `git push origin HEAD` is valid shell that does the wrong thing against an
  # empty repository, and pytest recreating __pycache__ inside the built tree is a
  # pipeline-ordering problem. Both were found by running the thing. This catches a
  # different and cheaper class.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Shell linting for the STANDALONE scripts. actionlint above already runs
  # shellcheck, but only over `run:` blocks inside the two workflows -- the 15
  # tracked .sh files were linted by nothing, and they include
  # terragrunt-skill/scripts/run_ci_checks.sh and the two job-feeds sweep tests
  # that drive a wrapper end to end.
  #
  # Added 2026-09-05 while the tree was already almost clean: shellcheck 0.11.0
  # found two findings across all 15 files, both `ls` in a report line, and
  # `bash -n` parsed every one. That is the cheapest this gate will ever be.
  # A gate added against two findings costs one commit; a gate added against two
  # hundred never gets added at all.
  #
  # Probed rather than assumed: an unquoted $var injected into a test script is
  # rejected (SC2086), and the injection reverted.
  #
  # shellcheck-py, NOT koalaman/shellcheck-precommit. The upstream hook runs in
  # Docker and fails outright when the daemon is not up -- tried here first, and
  # it produced "Cannot connect to the Docker daemon" rather than a lint result.
  # A gate that needs a container running is a gate that gets skipped. This one
  # is a pip-installed binary and pins the same shellcheck version (0.11.0) that
  # actionlint above bundles, so the two cannot disagree about what is a defect.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Structural checks, run here as well as in ci.yml. The hook is the point rather than a
  # duplicate: a plugin manifest that lists 22 skills for a repo containing 23 fails by
  # loading LESS, never by erroring, so nothing surfaces it until someone installs the
  # collection and counts. That is how frontier-rounds stayed invisible to every plugin
  # user until 2026-08-20 — found by installing, not by reading.
  #
  # It is stdlib-only and takes under a second over the whole repo, so it runs on every
  # commit rather than only on the files staged: a skill directory added without touching
  # a manifest is exactly the change that would otherwise slip past a file-scoped hook.
  - repo: local
    hooks:
      - id: check-conventions
        name: Skill structure and plugin manifests
        entry: python3 .github/scripts/check_conventions.py
        language: system
        pass_filenames: false
        always_run: true
