name: mirror ghost-publish

# `ghost-publish` is published as a standalone repo so Ghost users can find
# and install it without the other twenty-one skills. That copy is a BUILD
# ARTIFACT, never edited by hand: this repo stays the source of truth and the
# mirror is regenerated here, so the two cannot drift.
#
# One-time setup before this can run:
#   1. Create the empty target repo (default: kevin-burns/ghost-publish).
#   2. Add a repo secret MIRROR_TOKEN — a fine-grained PAT scoped to that ONE
#      repository with Contents: read and write. Nothing else.
# Without the secret the job skips rather than failing, so a fork or a
# contributor's push never trips it.

on:
  push:
    branches: [main]
    paths:
      - 'ghost-publish/**'
      - '.github/scripts/build_ghost_mirror.py'
      - '.github/workflows/mirror-ghost-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-ghost-publish
  cancel-in-progress: false

env:
  TARGET_REPO: kevin-burns/ghost-publish

jobs:
  mirror:
    name: rebuild and push the standalone repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Is the mirror configured?
        id: gate
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "MIRROR_TOKEN is not set — skipping. This is expected on forks."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Build first, and run the skill's own tests against the BUILT tree
      # rather than the source. A mirror that ships a broken copy is worse
      # than no mirror, and this is the only place that difference shows up.
      - name: Build the mirror
        if: steps.gate.outputs.configured == 'true'
        run: |
          python3 .github/scripts/build_ghost_mirror.py --root . --out /tmp/mirror
          python3 -m pip install --quiet pytest
          ( cd /tmp/mirror/ghost-publish && python3 -m pytest tests -q )

      - name: Push to ${{ env.TARGET_REPO }}
        if: steps.gate.outputs.configured == 'true'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/${TARGET_REPO}.git" /tmp/target

          # Replace the tracked content wholesale, but never touch .git.
          # --delete removes files the builder no longer produces, so a
          # renamed script cannot leave a stale copy behind for users.
          rsync -a --delete --exclude '.git/' /tmp/mirror/ /tmp/target/

          cd /tmp/target
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          # On the very first run the target repo has no commits, so HEAD is
          # unborn and `git diff --cached` has nothing to compare against.
          if git rev-parse --verify HEAD >/dev/null 2>&1 && git diff --cached --quiet; then
            echo "mirror already matches source — nothing to push"
            exit 0
          fi

          # Ordinary commit on top of history. Never force-push: the mirror's
          # history is the record of what users actually installed.
          git commit -m "sync ghost-publish from claude-skills@${SOURCE_SHA:0:7}

          Generated by .github/workflows/mirror-ghost-publish.yml.
          Source: https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}
          Do not edit this repository directly; changes are overwritten."
          # Push to main explicitly. Cloning an EMPTY repo leaves HEAD on an
          # unborn branch named from the runner's init.defaultBranch -- `master`
          # on stock git -- so `git push origin HEAD` would create a second
          # branch beside the repo's `main` default on the first run.
          git push origin HEAD:refs/heads/main
          echo "pushed to ${TARGET_REPO}"
