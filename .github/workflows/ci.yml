name: ci

# What this does and does NOT do, stated up front so nobody mistakes a
# green tick for more than it is.
#
# It validates STRUCTURE and runs the tests that exist. Most skills here
# are prose — instructions for a model — and nothing automated can tell
# you whether those instructions are any good. Five of twenty-one skills
# ship executable tests; those get a real run, the rest get their
# conventions checked and nothing more.
#
# The failure mode CI cannot see is the one that actually bites a repo
# this size: two skill descriptions overlapping so a request routes to the
# wrong skill. Catching that needs a model, so it stays a local check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned to the same version as the pre-commit hook, deliberately. A CI
      # lint that disagrees with the local gate is worse than no CI lint: it
      # fails on a push that passed every hook, and the fix is invisible.
      # When one moves, both move.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # Configuration lives in ruff.toml at the repo root, with every threshold
      # recorded next to the measurement that chose it. Nothing is passed here
      # that could disagree with what runs locally.
      - name: ruff check
        run: uvx ruff@0.16.3 check --output-format github .

      # The pre-commit hook covers whoever ran `prek install`. This covers everyone
      # else, which for a public repo taking outside changes is the case that matters.
      # Same version the hook pins; when one moves, both move. shellcheck is
      # preinstalled on ubuntu-latest, and it is what makes this worth running at all
      # on workflows as shell-heavy as these.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: actionlint
        run: actionlint -color

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is the whole point of this job. The pre-commit hook already
      # scans staged changes; what it cannot answer is whether something ALREADY
      # LANDED. A shallow clone would turn this into a slower duplicate of the hook.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The binary is downloaded from a pinned release rather than using
      # gitleaks-action, deliberately: the action requires a GITLEAKS_LICENSE once a
      # repo belongs to an organisation, and that failure would arrive on the day the
      # repo moves rather than the day the workflow changed. Same version the
      # pre-commit hook pins — when one moves, both move.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact so a finding does not print the secret into a PUBLIC build log, which
      # would widen the exposure the job exists to catch. The fingerprint and file are
      # still reported, which is what you need to act on it.
      #
      # Dismissals live in .gitleaksignore, pinned per finding with the evidence written
      # beside them. A finding is either rotated or demonstrated not to be a credential.
      - name: Scan full history
        run: gitleaks git --redact --verbose .

  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # No pip install: the checker is stdlib-only, so a stray third-party
      # import fails here rather than passing on a pre-populated runner.
      - name: Structural checks
        run: python3 .github/scripts/check_conventions.py

      # The skill-tests job globs */tests and */*/tests, and neither matches a
      # dotted directory -- so the mirror builder's suite has to be named here
      # or it silently never runs. It guards what strangers install from the
      # standalone ghost-publish repo, which is the one tree nobody reviews.
      - name: Mirror builder tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest .github/scripts/tests -q

  skill-tests:
    name: skill tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor (raised from 3.9 on 2026-08-13). 3.9 went
        # end-of-life on 2025-10-31, and every PEP 723 script in this repo
        # already pinned >= 3.10 or >= 3.12, so the old floor only ever
        # applied to the stdlib-only subset.
        #
        # What we give up, stated plainly: the 3.9 leg had caught two real
        # defects that newer interpreters hide — datetime.fromisoformat
        # rejecting a 'Z' suffix, and backslashes being illegal inside
        # f-string expressions before 3.12. Both are fixed; we lose the
        # tripwire for the next one of that shape.
        #
        # What it costs users: macOS ships 3.9.6 as /usr/bin/python3, so the
        # documented python3 fallback no longer works on a stock Mac.
        # CONTRIBUTING.md's decision rule says so explicitly.
        python: ['3.12', '3.13']
    steps:
      # ffmpeg so audio-dependent tests actually execute rather than skipping.
      # transcribe-summarize has nine that guard its timestamp mapping and its
      # audio-preparation ordering; skipped tests read as green.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # pytest is a CI tool here, not a runtime dependency. The skills
      # themselves stay stdlib-only; nothing below installs anything a
      # skill imports at run time.
      - name: Install test runner
        run: python3 -m pip install --quiet pytest

      # Some graders are PEP 723 scripts pinning requires-python >= 3.12. uv
      # fetches its own interpreter for those, so they run on every matrix leg
      # including 3.9 -- the leg's Python governs the skills' own tests, not
      # the grader's shebang.
      # Pinned to an exact tag on purpose: setup-uv publishes only full semver
      # tags, with no floating `v9` alias, so the usual major-version pin fails
      # to resolve at all rather than degrading gracefully.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # Both runners are discovered, not enumerated, so a new skill with
      # tests is picked up without anyone remembering to edit this file.
      # Two layouts exist in this repo and only one is unittest — running
      # just `unittest discover` silently skipped 62 passing tests, which
      # is exactly the kind of quiet gap this job is supposed to close.
      - name: Run every skill's tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -u
          status=0
          found=0

          run_suite() {                       # dir, runner-command...
            local where="$1"; shift
            local skill="${where%%/*}"
            found=$((found + 1))
            echo "::group::${skill} (${where})"
            if ( cd "$where" && "$@" ); then
              echo "${skill}: pass"
            else
              echo "::error title=${skill}::test suite failed (${where})"
              status=1
            fi
            echo "::endgroup::"
          }

          for suite in */scripts/tests; do
            [ -d "$suite" ] || continue
            run_suite "${suite%/tests}" python3 -m unittest discover -s tests
          done

          # A suite is Python or shell, decided by what is IN it rather than by
          # where it sits. Shell suites exist (job-feeds/examples/tests drives the
          # sweep wrapper end to end, which pytest cannot do), and pointing pytest
          # at one produces "no tests ran" -- reported as a failure, with nothing
          # naming the real cause. Dispatching on contents keeps the discovery
          # property this job is built on: add a suite, it runs, in either language.
          for suite in */tests */*/tests; do
            [ -d "$suite" ] || continue
            case "$suite" in */scripts/tests|*/.venv/*|*/site-packages/*) continue ;; esac
            if compgen -G "$suite/test_*.py" > /dev/null || compgen -G "$suite/*_test.py" > /dev/null; then
              run_suite "${suite%/tests}" python3 -m pytest tests -q
            elif compgen -G "$suite/*.sh" > /dev/null; then
              # One run_suite call per file, so each shell test gets its own
              # collapsible group and its own pass/fail line. Done here rather
              # than in a helper because a function reached only through "$@" is
              # invisible to shellcheck, which then reports the whole body as
              # unreachable -- two waivers to silence a warning that a plain
              # loop never provokes.
              for t in "$suite"/*.sh; do
                run_suite "${suite%/tests}" bash "tests/${t##*/}"
              done
            else
              # Silence here would be the same gap in a new costume.
              echo "::error title=${suite}::tests/ holds nothing this runner recognises"
              status=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::no test suites discovered — the globs are wrong"
            exit 1
          fi
          echo "ran ${found} suite(s)"
          exit $status

      - name: Run every skill's offline eval
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -u
          status=0
          ran=0
          skipped=0

          # Two different things live under evals/grade.py, and conflating them
          # is how three evals sat unrun behind the reason "needs uv":
          #
          #   * Offline behavioural evals — self-contained, assert on committed
          #     fixtures. These are the ones CI exists to run.
          #   * skill-creator workspace graders — they score generated eval RUNS
          #     under <skill>-workspace/iteration-N/, which is gitignored. No
          #     amount of tooling makes these runnable here; there is nothing to
          #     grade. They declare `ci-skip: needs-eval-workspace` in their
          #     docstring and are skipped by that marker, with the real reason
          #     printed rather than a misleading one.
          for grader in */evals/grade.py; do
            [ -f "$grader" ] || continue
            skill="${grader%%/*}"

            if grep -q '^ci-skip: needs-eval-workspace' "$grader"; then
              echo "${skill}: SKIPPED — grades skill-creator runs, not the skill"
              skipped=$((skipped + 1))
              continue
            fi

            # A third kind, and it needs its own reason rather than borrowing one
            # above: an ablation grader reads a bank of MODEL RESPONSES. That bank
            # is gitignored because an arm is built from SKILL.md, so a committed
            # run guarantees today's arm gets compared against last week's answer.
            # Re-running the experiment costs money and is a decision, not a CI
            # step. The grader's own logic is covered by unit tests in the step
            # above, so this skips the end-to-end run and nothing else.
            if grep -q '^ci-skip: needs-run-bank' "$grader"; then
              echo "${skill}: SKIPPED — grades a run bank that is gitignored by design"
              skipped=$((skipped + 1))
              continue
            fi

            # A PEP 723 shebang means the grader pins its own interpreter and
            # deps; run it through uv so that pin is honoured. Everything else
            # runs on the matrix Python, which is the point of the 3.9 leg.
            if head -3 "$grader" | grep -q 'uv run --script'; then
              runner="uv run --script evals/grade.py"
            else
              runner="python3 evals/grade.py"
            fi

            ran=$((ran + 1))
            echo "::group::${skill} (${runner%% *})"
            if ( cd "$skill" && $runner ); then
              echo "${skill}: pass"
            else
              echo "::error title=${skill}::eval failed"
              status=1
            fi
            echo "::endgroup::"
          done

          # Guards the globs and the marker together: if a rename or a stray
          # marker silences everything, a green tick must not be the result.
          if [ "$ran" -eq 0 ]; then
            echo "::error::no evals ran — check the glob and the ci-skip markers"
            exit 1
          fi
          echo "ran ${ran} eval(s), skipped ${skipped}"
          exit $status
